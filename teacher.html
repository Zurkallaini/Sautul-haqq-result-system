<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --green: #0b3d33;
    --green-2: #11594a;
    --gold: #c9a24b;
    --gold-soft: #e6d3a0;
    --paper: #f3f0e6;
    --line: #cfc9b6;
    --ink: #1d2a27;
    --muted: #5a6b66;
    --logo-size: 100px; /* 👈 change to make the header logo bigger or smaller */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Cairo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* ---------- Header ---------- */
.top-bar {
    background: var(--green);
    border-bottom: 4px solid var(--gold);
    padding: 24px 20px;
}

.top-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    object-fit: contain;
    border-radius: 50%;
}

.logo-fallback {
    display: none;
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    place-items: center;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    color: var(--gold-soft);
    font-family: "Amiri", serif;
    font-size: 1.8rem;
}

.school-ar {
    font-family: "Amiri", serif;
    font-size: 1.25rem;
    line-height: 1.3;
    color: var(--gold-soft);
}

.top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
}

/* ---------- Cards ---------- */
.box {
    background: #fff;
    border: 1px solid #e2dcc9;
    border-radius: 14px;
    padding: 24px 20px;
    max-width: 480px;
    margin: 24px 16px;
}

@media (min-width: 512px) {
    .box { margin: 28px auto; padding: 28px; }
}

h2 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--green);
}

#loginBox h2 { margin-bottom: 4px; }

.sub {
    color: var(--muted);
    margin-bottom: 18px;
    font-size: .95rem;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

input:focus {
    outline: none;
    border-color: var(--green-2);
    box-shadow: 0 0 0 3px rgba(17,89,74,.18);
}

button {
    font: inherit;
    cursor: pointer;
    transition: background .15s, transform .05s;
}

button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#loginBox > button {
    width: 100%;
    height: 50px;
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: var(--green-2);
    border: none;
    border-radius: 10px;
}

#loginBox > button:hover { background: var(--green); }

/* ---------- Dashboard ---------- */
#dashboard { display: none; }

.welcome { margin-bottom: 18px; }

.info {
    margin-top: 12px;
    padding: 12px 14px;
    font-size: .9rem;
    line-height: 1.6;
    color: var(--ink);
    background: #f8f2de;
    border-left: 4px solid var(--gold);
    border-radius: 8px;
}

.menu { display: grid; gap: 10px; }

.menu-btn {
    width: 100%;
    min-height: 54px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    font-size: 1rem;
    font-weight: 600;
    color: var(--green);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

.menu-btn i {
    width: 34px;
    height: 34px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--gold-soft);
    background: var(--green);
    font-size: .9rem;
}

.menu-btn:hover { background: #faf5e6; border-color: var(--gold); }

.menu-btn.primary {
    color: #fff;
    background: var(--green-2);
    border-color: var(--green-2);
}

.menu-btn.primary:hover { background: var(--green); }
.menu-btn.primary i { color: var(--green); background: var(--gold); }

.logout {
    width: 100%;
    height: 50px;
    margin-top: 16px;
    font-size: 1rem;
    font-weight: 700;
    color: #b3261e;
    background: #fff;
    border: 2px solid #b3261e;
    border-radius: 10px;
}

.logout:hover { color: #fff; background: #b3261e; }

/* ---------- Messages ---------- */
.error { color: #b3261e; text-align: center; font-weight: 700; margin-top: 14px; }
.success { color: #1b7a4b; text-align: center; font-weight: 700; margin-top: 14px; }
</style>
</head>
<body>

<header class="top-bar">
    <div class="top-inner">
        <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
        <img
            class="logo"
            src="my-logo.png"
            alt="School logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
        >
        <div class="logo-fallback" id="logoFallback">ص</div>

        <div>
            <div class="school-ar" dir="rtl">مدرسة صوت الحق</div>
            <h1>Teacher Dashboard</h1>
        </div>
    </div>
</header>

<div class="box" id="loginBox">
  <h2>Teacher Login</h2>
  <p class="sub">Enter your code to continue</p>
  <input type="text" id="teacherCode" placeholder="Enter Teacher Code" aria-label="Teacher code">
  <button onclick="loginTeacher()">Login</button>
  <div id="loginMsg"></div>
</div>

<div class="box" id="dashboard">
  <div class="welcome">
    <h2>Welcome <span id="teacherName"></span></h2>
    <div class="info">You can access all classes and subjects. Select the class + subject you teach in the mark sheet.</div>
  </div>

  <div class="menu">
    <button class="menu-btn primary" onclick="window.location.href='marksheet.html'">
      <i class="fa-solid fa-pen-to-square"></i> Enter/Edit Marks
    </button>

    <button class="menu-btn" onclick="window.location.href='viewmarks.html'">
      <i class="fa-solid fa-eye"></i> View Saved Marks
    </button>

    <button class="menu-btn" onclick="window.location.href='teacher_comment.html'">
      <i class="fa-solid fa-clipboard-user"></i> Teacher Comment &amp; Attendance
    </button>

    <button class="menu-btn" onclick="window.location.href='report.html'">
      <i class="fa-solid fa-file-lines"></i> Class Report Sheet
    </button>

    <button class="menu-btn" onclick="window.location.href='BroadSheet.html'">
      <i class="fa-solid fa-table-list"></i> View Broad Sheet
    </button>

    <button class="menu-btn" onclick="window.location.href='viewstudents.html'">
      <i class="fa-solid fa-users"></i> View Students List
    </button>

    <button class="menu-btn" onclick="window.location.href='class_subject.html'">
      <i class="fa-solid fa-book"></i> Class Subjects
    </button>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://epgegesdptpaegycughz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2VnZXNkcHRwYWVneWN1Z2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjk4NzcsImV4cCI6MjA5NzMwNTg3N30.9eK3TvMP5Ve_ZMQlGV12aSpT84CMxDUJTk_fnHCSBfQ'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

if(localStorage.getItem('teacher')){
  showDashboard(JSON.parse(localStorage.getItem('teacher')))
}

async function loginTeacher(){
  let code = document.getElementById('teacherCode').value.trim()
  if(!code){showMsg('Enter teacher code','error'); return}
  
  let {data, error} = await db.from('teachers').select('*').eq('code', code).single()
  
  if(error || !data){
    showMsg('Invalid teacher code','error')
  } else {
    localStorage.setItem('teacher', JSON.stringify(data))
    showDashboard(data)
    showMsg('Login successful!','success')
  }
}

function showDashboard(teacher){
  document.getElementById('loginBox').style.display = 'none'
  document.getElementById('dashboard').style.display = 'block'
  document.getElementById('teacherName').innerText = teacher.name
}

function logout(){
  localStorage.removeItem('teacher')
  location.reload()
}

function showMsg(text, type){
  document.getElementById('loginMsg').innerHTML = `<div class="${type}">${text}</div>`
}
</script>
</body>
  </html>
