<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Subjects</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --green: #0b3d33;
    --green-2: #11594a;
    --gold: #c9a24b;
    --gold-soft: #e6d3a0;
    --paper: #f3f0e6;
    --line: #cfc9b6;
    --ink: #1d2a27;
    --muted: #5a6b66;
    --logo-size: 100px; /* 👈 change to make the header logo bigger or smaller */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Cairo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* ---------- Header ---------- */
.top-bar {
    background: var(--green);
    border-bottom: 4px solid var(--gold);
    padding: 24px 20px;
}

.top-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    object-fit: contain;
    border-radius: 50%;
}

.logo-fallback {
    display: none;
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    place-items: center;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    color: var(--gold-soft);
    font-family: "Amiri", serif;
    font-size: 1.8rem;
}

.school-ar {
    font-family: "Amiri", serif;
    font-size: 1.25rem;
    line-height: 1.3;
    color: var(--gold-soft);
}

.top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
}

/* ---------- Card ---------- */
.box {
    background: #fff;
    border: 1px solid #e2dcc9;
    border-radius: 14px;
    padding: 20px;
    max-width: 700px;
    margin: 20px 16px;
}

@media (min-width: 732px) {
    .box { margin: 24px auto; padding: 24px; }
}

.back {
    margin-bottom: 18px;
    padding: 0 14px;
    height: 40px;
    font: inherit;
    font-size: .9rem;
    font-weight: 700;
    color: var(--green);
    background: #fff;
    border: 2px solid var(--gold);
    border-radius: 10px;
    cursor: pointer;
}

.back:hover { background: #faf5e6; }
.back:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

label {
    display: block;
    margin-bottom: 6px;
    font-size: .9rem;
    font-weight: 600;
}

select {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

select:focus {
    outline: none;
    border-color: var(--green-2);
    box-shadow: 0 0 0 3px rgba(17,89,74,.18);
}

h3 {
    margin: 24px 0 4px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--green);
}

h3 span { color: var(--green-2); }

/* ---------- Table ---------- */
table {
    width: 100%;
    margin-top: 12px;
    border-collapse: collapse;
    border: 1px solid #e2dcc9;
    border-radius: 10px;
    overflow: hidden;
}

th {
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--gold-soft);
    background: var(--green);
}

th:first-child, td:first-child { width: 64px; text-align: center; }

td {
    padding: 12px 14px;
    border-bottom: 1px solid #ebe6d5;
}

tbody tr:nth-child(even) { background: #faf8f2; }

.no-data {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
}

/* ---------- Messages ---------- */
.error { color: #b3261e; font-weight: 700; margin-top: 12px; }
</style>
</head>
<body>

<header class="top-bar">
    <div class="top-inner">
        <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
        <img
            class="logo"
            src="my-logo.png"
            alt="School logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
        >
        <div class="logo-fallback" id="logoFallback">ص</div>

        <div>
            <div class="school-ar" dir="rtl"><center>  مدرسة صوت الحق
            </center>
              <br>
          <h6>قسم تحفيظ القرءآن والدراسات اللإسلامية </h6></div>
            <h1>Class Subjects</h1>
        </div>
    </div>
</header>

<div class="box">
<button class="back" onclick="history.back()">← Back</button>

<label for="classSelect">Select Class:</label>
<select id="classSelect">
<option value="">Loading classes...</option>
</select>

<div id="subjectBox" style="display:none;">
<h3>Subjects for <span id="className"></span></h3>
<table id="subjectTable">
<thead>
<tr>
<th>S/N</th>
<th>Subject Name</th>
</tr>
</thead>
<tbody id="subjectList"></tbody>
</table>
<p id="noSubject" class="no-data" style="display:none;">No subjects assigned to this class</p>
</div>

<div id="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://epgegesdptpaegycughz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2VnZXNkcHRwYWVneWN1Z2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjk4NzcsImV4cCI6MjA5NzMwNTg3N30.9eK3TvMP5Ve_ZMQlGV12aSpT84CMxDUJTk_fnHCSBfQ'
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

window.onload = loadClasses;

// Load all classes
async function loadClasses() {
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '<option value="">Loading classes...</option>';

    const {data, error} = await supabaseClient.from('classes').select('*').order('name');

    if(error) {
        sel.innerHTML = '<option value="">Error loading classes</option>';
        showMsg('Error: ' + error.message, 'error');
        return;
    }

    sel.innerHTML = '<option value="">-- Choose Class --</option>';
    data.forEach(c => {
        sel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    });
}

// Load subjects when class selected
document.getElementById('classSelect').onchange = async function() {
    const className = this.value;
    const subjectBox = document.getElementById('subjectBox');

    if(!className) {
        subjectBox.style.display = 'none';
        return;
    }

    document.getElementById('className').textContent = className;
    subjectBox.style.display = 'block';

    const tbody = document.getElementById('subjectList');
    const noSubject = document.getElementById('noSubject');
    tbody.innerHTML = '<tr><td colspan="2">Loading subjects...</td></tr>';
    noSubject.style.display = 'none';

    // Key fix: use subjects(name) because your column is 'name' not 'subject_name'
    const {data, error} = await supabaseClient
      .from('class_subjects')
      .select('subjects(name)')
      .eq('class_name', className);

    if(error) {
        tbody.innerHTML = '<tr><td colspan="2" style="color:red;">Error loading subjects</td></tr>';
        showMsg('Error: ' + error.message, 'error');
        return;
    }

    if(!data || data.length === 0) {
        tbody.innerHTML = '';
        noSubject.style.display = 'block';
        return;
    }

    tbody.innerHTML = '';
    data.forEach((row, i) => {
        let subName = row.subjects?.name || 'No name';
        tbody.innerHTML += `<tr><td>${i+1}</td><td>${subName}</td></tr>`;
    });
}

function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.innerHTML = `<p class="${type}">${text}</p>`;
    setTimeout(() => el.innerHTML = '', 4000);
}
</script>
</body>
    </html>
