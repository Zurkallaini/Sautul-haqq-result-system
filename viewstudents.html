<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Register - Teacher</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --green: #0b3d33;
    --green-2: #11594a;
    --gold: #c9a24b;
    --gold-soft: #e6d3a0;
    --paper: #f3f0e6;
    --line: #cfc9b6;
    --ink: #1d2a27;
    --muted: #5a6b66;
    --logo-size: 100px; /* 👈 change to make the header logo bigger or smaller */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Cairo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* ---------- Header ---------- */
.top-bar {
    background: var(--green);
    border-bottom: 4px solid var(--gold);
    padding: 24px 20px;
}

.top-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    object-fit: contain;
    border-radius: 50%;
}

.logo-fallback {
    display: none;
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    place-items: center;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    color: var(--gold-soft);
    font-family: "Amiri", serif;
    font-size: 1.8rem;
}

.school-ar {
    font-family: "Amiri", serif;
    font-size: 1.25rem;
    line-height: 1.3;
    color: var(--gold-soft);
}

.top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
}

/* ---------- Card ---------- */
.box {
    background: #fff;
    border: 1px solid #e2dcc9;
    border-radius: 14px;
    padding: 20px;
    max-width: 700px;
    margin: 20px 16px;
}

@media (min-width: 732px) {
    .box { margin: 24px auto; padding: 24px; }
}

.back {
    margin-bottom: 18px;
    padding: 0 14px;
    height: 40px;
    font: inherit;
    font-size: .9rem;
    font-weight: 700;
    color: var(--green);
    background: #fff;
    border: 2px solid var(--gold);
    border-radius: 10px;
    cursor: pointer;
}

.back:hover { background: #faf5e6; }
.back:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.info {
    margin-bottom: 20px;
    padding: 12px 14px;
    font-size: .9rem;
    line-height: 1.6;
    background: #f8f2de;
    border-left: 4px solid var(--gold);
    border-radius: 8px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: .9rem;
    font-weight: 600;
}

select {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

select:focus {
    outline: none;
    border-color: var(--green-2);
    box-shadow: 0 0 0 3px rgba(17,89,74,.18);
}

/* ---------- Table ---------- */
table {
    width: 100%;
    margin-top: 18px;
    border-collapse: collapse;
    border: 1px solid #e2dcc9;
    font-size: .95rem;
}

th {
    padding: 12px 10px;
    font-weight: 600;
    color: var(--gold-soft);
    background: var(--green);
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ebe6d5;
}

td:nth-child(2) { text-align: left; }
th:first-child, td:first-child { width: 56px; }
th:last-child, td:last-child { width: 100px; }

tbody tr:nth-child(even) { background: #faf8f2; }

button {
    font: inherit;
    cursor: pointer;
    transition: background .15s, transform .05s;
}

button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.btn-danger {
    height: 36px;
    padding: 0 14px;
    font-size: .85rem;
    font-weight: 700;
    color: #fff;
    background: #b3261e;
    border: none;
    border-radius: 8px;
}

.btn-danger:hover { background: #8f1d17; }

/* ---------- Messages ---------- */
.success { color: #1b7a4b; font-weight: 700; margin-top: 12px; }
.error { color: #b3261e; font-weight: 700; margin-top: 12px; }
</style>
</head>
<body>

<header class="top-bar">
    <div class="top-inner">
        <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
        <img
            class="logo"
            src="my-logo.png"
            alt="School logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
        >
        <div class="logo-fallback" id="logoFallback">ص</div>

        <div>
            <div class="school-ar" dir="rtl"><center>  مدرسة صوت الحق
            </center>
              <br>
          <h6>قسم تحفيظ القرءآن والدراسات اللإسلامية </h6></div>
            <h1>Class Register</h1>
        </div>
    </div>
</header>

<div class="box">
<button class="back" onclick="history.back()">← Back</button>

<div class="info">⚠️ Teacher Register: You can delete students who left your class.</div>

<label for="clsSelect">Select Your Class:</label>
<select id="clsSelect" onchange="loadStudents()">
<option value="">Select Class</option>
</select>

<table id="studentTable" style="display:none">
<thead>
<tr>
<th>S/N</th>
<th>STUDENT NAME</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="studentBody">
</tbody>
</table>

<div id="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://epgegesdptpaegycughz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2VnZXNkcHRwYWVneWN1Z2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjk4NzcsImV4cCI6MjA5NzMwNTg3N30.9eK3TvMP5Ve_ZMQlGV12aSpT84CMxDUJTk_fnHCSBfQ'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

window.onload = loadClasses;

async function loadClasses(){
  const {data} = await db.from('classes').select('name').order('name');
  const sel = document.getElementById('clsSelect');
  sel.innerHTML = '<option value="">Select Class</option>';
  data?.forEach(c => sel.innerHTML += `<option value="${c.name}">${c.name}</option>`);
}

async function loadStudents(){
  const cls = document.getElementById('clsSelect').value;
  const table = document.getElementById('studentTable');
  const tbody = document.getElementById('studentBody');
  
  if(!cls){
    table.style.display = 'none';
    return;
  }
  
  const {data, error} = await db.from('students').select('*').eq('class', cls).order('name');
  
  if(error || !data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="3">No students found</td></tr>';
    table.style.display = 'table';
    return;
  }
  
  table.style.display = 'table';
  tbody.innerHTML = '';
  data.forEach((s, i) => {
    tbody.innerHTML += `
    <tr data-id="${s.id}">
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td class="actions">
        <button class="btn-danger" onclick="deleteStudent('${s.id}')">Delete</button>
      </td>
    </tr>`;
  });
}

// Teacher can delete students from their class
async function deleteStudent(id){
  if(!confirm('Delete this student from class register?')) return;
  
  const {error} = await db.from('students').delete().eq('id', id);
  
  if(error){
    showMsg('Error: '+error.message, 'error');
  } else {
    showMsg('✅ Student deleted from register', 'success');
    loadStudents(); // refresh list, S/N will renumber 1,2,3...
  }
}

function showMsg(text, type) {
  document.getElementById('msg').innerHTML = `<div class="${type}">${text}</div>`;
  setTimeout(() => {document.getElementById('msg').innerHTML = ''}, 3000);
}
</script>
</body>
  </html>
