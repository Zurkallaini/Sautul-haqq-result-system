<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Result Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="login-container">

    <!-- Brand panel -->
    <section class="brand-panel">
        <div class="brand-inner">

            <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
            <img
                class="logo"
                src="my-logo.png"
                alt="School logo"
                onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
            >
            <div class="logo-fallback" id="logoFallback">ص</div>

            <h1>مدرسة صوت الحق</h1>
            <p id="my">قسم تحفيظ القرءآن والدراسات الإسلامية صكتو</p>
        </div>
    </section>

    <!-- Login panel -->
    <section class="form-panel">
        <div class="login-box">

            <h2>Welcome back</h2>
            <p class="center">Sign in to manage student results</p>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <label for="role">Sign in as</label>
                <select id="role">
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Login</button>

            </form>

            <div id="message"></div>

        </div>
    </section>

</main>

<script src="auth.js"></script>

</body>
    </html>
