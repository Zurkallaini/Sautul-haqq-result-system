<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAUTUL HAQQ BROAD SHEET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --green: #0b3d33;
    --green-2: #11594a;
    --gold: #c9a24b;
    --gold-soft: #e6d3a0;
    --paper: #f3f0e6;
    --line: #cfc9b6;
    --ink: #1d2a27;
    --muted: #5a6b66;
    --logo-size: 100px; /* 👈 change to make the header logo bigger or smaller */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Cairo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* ---------- Header ---------- */
.top-bar {
    background: var(--green);
    border-bottom: 4px solid var(--gold);
    padding: 24px 20px;
}

.top-inner {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    object-fit: contain;
    border-radius: 50%;
}

.logo-fallback {
    display: none;
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    place-items: center;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    color: var(--gold-soft);
    font-family: "Amiri", serif;
    font-size: 1.8rem;
}

.school-ar {
    font-family: "Amiri", serif;
    font-size: 1.25rem;
    line-height: 1.3;
    color: var(--gold-soft);
}

.top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
}

.top-bar p { font-size: .85rem; color: #d6e3df; }

/* ---------- Card ---------- */
.container {
    max-width: 1300px;
    margin: 20px 16px;
    padding: 20px;
    background: #fff;
    border: 1px solid #e2dcc9;
    border-radius: 14px;
}

@media (min-width: 1340px) {
    .container { margin: 24px auto; padding: 24px; }
}

.back {
    margin-bottom: 18px;
    padding: 0 14px;
    height: 40px;
    font: inherit;
    font-size: .9rem;
    font-weight: 700;
    color: var(--green);
    background: #fff;
    border: 2px solid var(--gold);
    border-radius: 10px;
    cursor: pointer;
}

.back:hover { background: #faf5e6; }

/* ---------- Controls ---------- */
.controls {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    max-width: 760px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 14px 0 20px;
}

select {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

select:focus {
    outline: none;
    border-color: var(--green-2);
    box-shadow: 0 0 0 3px rgba(17,89,74,.18);
}

button {
    height: 48px;
    padding: 0 22px;
    font: inherit;
    font-size: .95rem;
    font-weight: 700;
    color: #fff;
    background: var(--green-2);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, transform .05s;
}

button:hover { background: var(--green); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

button.back { height: 40px; padding: 0 14px; color: var(--green); background: #fff; border: 2px solid var(--gold); }
button.back:hover { background: #faf5e6; }
.btn-print { color: var(--green); background: #fff; border: 2px solid var(--gold); }
.btn-print:hover { color: var(--green); background: #faf5e6; }

/* ---------- Stat cards ---------- */
.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    padding: 16px;
    background: #faf8f2;
    border: 1px solid #e2dcc9;
    border-left: 5px solid var(--gold);
    border-radius: 10px;
}

.card h4 {
    margin-bottom: 4px;
    font-size: .85rem;
    font-weight: 600;
    color: var(--muted);
}

.card h2 {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--green);
}

/* ---------- Table ---------- */
.table-container {
    overflow: auto;
    max-height: 72vh;
    border: 1px solid #e2dcc9;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: .92rem;
}

th {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 12px 8px;
    min-width: 64px;
    font-size: .75rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--gold-soft);
    background: var(--green);
    border-right: 1px solid rgba(255,255,255,.12);
}

td {
    padding: 9px 8px;
    text-align: center;
    background: #fff;
    border-bottom: 1px solid #ebe6d5;
    border-right: 1px solid #f0ecde;
}

tbody tr:nth-child(even) td { background: #faf8f2; }

/* S/N and name stay visible while scrolling sideways */
th:nth-child(1), td:nth-child(1) {
    position: sticky; left: 0;
    width: 44px; min-width: 44px;
}
th:nth-child(2), td:nth-child(2) {
    position: sticky; left: 44px;
    min-width: 150px;
    text-align: left;
    box-shadow: 2px 0 0 #e2dcc9;
}
th:nth-child(1), th:nth-child(2) { z-index: 4; }
td:nth-child(1), td:nth-child(2) { z-index: 1; }

.student-name { text-align: left; font-weight: 600; }

/* TOTAL and POSITION columns */
td:nth-last-child(2), td:nth-last-child(1) { background: #f8f2de; }
td b { color: var(--green); }
sup { font-size: 10px; vertical-align: super; }

/* message rows (Loading..., No students found) */
td[colspan] {
    position: static; box-shadow: none;
    text-align: left; color: var(--muted);
    background: #fff;
}

/* ---------- Footer ---------- */
.footer {
    margin-top: 20px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: .95rem;
    background: #faf8f2;
    border: 1px solid #e2dcc9;
    border-radius: 10px;
}

/* ---------- Phones ---------- */
@media (max-width: 760px) {
    .container { padding: 14px; margin: 16px 10px; }
    .back { width: 100%; }
    .controls { grid-template-columns: 1fr; }
    .actions button { flex: 1 1 100%; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card h2 { font-size: 1.4rem; }

    table { font-size: .8rem; }
    th { padding: 10px 4px; font-size: .68rem; min-width: 56px; }
    td { padding: 8px 4px; }

    th:nth-child(1), td:nth-child(1) { width: 34px; min-width: 34px; }
    th:nth-child(2), td:nth-child(2) { left: 34px; min-width: 100px; max-width: 120px; }
}

/* ---------- Print ---------- */
@page { size: landscape; margin: 10mm; }

@media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print, .back { display: none; }
    body { background: #fff; }
    .container { border: none; margin: 0; padding: 0; }
    .table-container { max-height: none; overflow: visible; border: none; }
    table { font-size: 9pt; }
    th, td { position: static !important; box-shadow: none !important; }
    th { min-width: 0; }
}
</style>
</head>
<body>

<header class="top-bar">
    <div class="top-inner">
        <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
        <img
            class="logo"
            src="my-logo.png"
            alt="School logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
        >
        <div class="logo-fallback" id="logoFallback">ص</div>

        <div>
            <div class="school-ar" dir="rtl"><center>  مدرسة صوت الحق
            </center>
              <br>
          <h6>قسم تحفيظ القرءآن والدراسات اللإسلامية </h6></div>
            <h1>BROAD SHEET</h1>
            <p>Academic Performance Summary</p>
        </div>
    </div>
</header>

<div class="container">

<button class="back no-print" onclick="history.back()">← Back</button>

<div class="controls no-print">
<select id="classSelect" aria-label="Class"><option value="">Select Class</option></select>

<select id="termSelect" aria-label="Term">
<option value="">Select Term</option>
<option>1st Term</option>
<option>2nd Term</option>
<option>3rd Term</option>
</select>

<select id="sessionSelect" aria-label="Session">
<option value="">Select Session</option>
<option>2025/2026</option>
<option>2026/2027</option>
</select>
</div>

<div class="actions no-print">
<button onclick="generateBroadSheet()">Generate</button>
<button class="btn-print" onclick="window.print()">Print</button>
</div>

<div class="stats">
<div class="card"><h4>Total Students</h4><h2 id="studentCount">0</h2></div>
<div class="card"><h4>Total Subjects</h4><h2 id="subjectCount">0</h2></div>
<div class="card"><h4>Class Average</h4><h2 id="classAverage">0</h2></div>
<div class="card"><h4>Highest Score</h4><h2 id="highestScore">0</h2></div>
</div>

<div class="table-container">
<table>
<thead>
<tr id="subjectHeader">
<th>S/N</th>
<th>STUDENT NAME</th>
</tr>
</thead>
<tbody id="broadsheetBody"></tbody>
</table>
</div>

<div class="footer">
<div>Class Average: <strong id="footerAverage">0</strong></div>
<div>Class Teacher: __________________</div>
<div>Principal: __________________</div>
</div>

</div>

<script>
const SUPABASE_URL="https://epgegesdptpaegycughz.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2VnZXNkcHRwYWVneWN1Z2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjk4NzcsImV4cCI6MjA5NzMwNTg3N30.9eK3TvMP5Ve_ZMQlGV12aSpT84CMxDUJTk_fnHCSBfQ";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function formatPosition(n){
if(n%100>=11 && n%100<=13) return `${n}<sup>th</sup>`;
switch(n%10){
case 1:return `${n}<sup>st</sup>`;
case 2:return `${n}<sup>nd</sup>`;
case 3:return `${n}<sup>rd</sup>`;
default:return `${n}<sup>th</sup>`;
}
}

loadClasses();

async function loadClasses(){
const select=document.getElementById("classSelect");
const {data,error}=await db.from("classes").select("*").order("name");
if(error){
console.error(error);
return;
}

data.forEach(cls=>{
select.innerHTML+=`<option value="${cls.name}">${cls.name}</option>`;
});
}

async function generateBroadSheet(){

const className=document.getElementById("classSelect").value;
const term=document.getElementById("termSelect").value;
const session=document.getElementById("sessionSelect").value;

if(!className||!term||!session){
alert("Please Select Class, Term and Session");
return;
}

const header=document.getElementById("subjectHeader");
const body=document.getElementById("broadsheetBody");

header.innerHTML="<th>S/N</th><th>STUDENT NAME</th>";
body.innerHTML="<tr><td colspan='20'>Loading...</td></tr>";

const {data:classSubjects}=await db
.from("class_subjects")
.select("subject_id, subjects(name)")
.eq("class_name",className);

const subjects=classSubjects.map(cs=>({
id:cs.subject_id,
name:cs.subjects.name
}));

subjects.forEach(s=>{
header.innerHTML+=`<th>${s.name.toUpperCase()}</th>`;
});

header.innerHTML+=`<th>TOTAL</th><th>POSITION</th>`;
document.getElementById("subjectCount").textContent=subjects.length;
const {data:students}=await db
.from("students")
.select("*")
.eq("class",className)
.order("name");

document.getElementById("studentCount").textContent=students.length;

if(students.length===0){
body.innerHTML=`<tr><td colspan="${subjects.length+4}">No students found for ${className}</td></tr>`;
return;
}

const studentIds=students.map(s=>s.id);
const subjectIds=subjects.map(s=>s.id);

const {data:allMarks}=await db
.from("marks")
.select("*")
.in("student_id",studentIds)
.in("subject_id",subjectIds)
.eq("class",className)
.eq("term",term)
.eq("session",session);

let broadData=[];

for(const student of students){

let studentMarks=[];
let grandTotal=0;

for(const subject of subjects){

const mark=allMarks.find(
m=>m.student_id===student.id &&
m.subject_id===subject.id
);

const score=mark ? Number(mark.total) : 0;

studentMarks.push(score);
grandTotal+=score;
}

broadData.push({
student,
marks:studentMarks,
total:grandTotal,
position:0
});
}

broadData.sort((a,b)=>b.total-a.total);

// Competition ranking: handles ties like 1st, 1st, 3rd
let currentRank = 1;
for(let i = 0; i < broadData.length; i++){
    if(i > 0 && broadData[i].total < broadData[i-1].total){
        currentRank = i + 1;
    }
    broadData[i].position = currentRank;
}

const highestScore=broadData.length
? broadData[0].total
: 0;

const classAverage=students.length
? (broadData.reduce((a,b)=>a+b.total,0)/students.length).toFixed(2)
: 0;

document.getElementById("highestScore").textContent=highestScore;
document.getElementById("classAverage").textContent=classAverage;
document.getElementById("footerAverage").textContent=classAverage;

body.innerHTML="";

broadData.forEach((item,index)=>{

let row=`<tr>
<td>${index+1}</td>
<td class="student-name">${item.student.name}</td>`;

item.marks.forEach(score=>{
row+=`<td>${score}</td>`;
});

row+=`
<td><b>${item.total}</b></td>
<td><b>${formatPosition(item.position)}</b></td>
</tr>`;

body.innerHTML+=row;
});

}
</script>

</body>
    </html>
