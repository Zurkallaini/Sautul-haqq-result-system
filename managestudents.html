<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --green: #0b3d33;
    --green-2: #11594a;
    --gold: #c9a24b;
    --gold-soft: #e6d3a0;
    --paper: #f3f0e6;
    --line: #cfc9b6;
    --ink: #1d2a27;
    --muted: #5a6b66;
    --logo-size: 100px; /* 👈 change to make the header logo bigger or smaller */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Cairo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* ---------- Header ---------- */
.top-bar {
    background: var(--green);
    border-bottom: 4px solid var(--gold);
    padding: 24px 20px;
}

.top-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    object-fit: contain;
    border-radius: 50%;
}

.logo-fallback {
    display: none;
    width: var(--logo-size);
    height: var(--logo-size);
    flex: none;
    place-items: center;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    color: var(--gold-soft);
    font-family: "Amiri", serif;
    font-size: 1.8rem;
}

.school-ar {
    font-family: "Amiri", serif;
    font-size: 1.25rem;
    line-height: 1.3;
    color: var(--gold-soft);
}

.top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
}

/* ---------- Card ---------- */
.box {
    background: #fff;
    border: 1px solid #e2dcc9;
    border-radius: 14px;
    padding: 20px;
    max-width: 1200px;
    margin: 20px 16px;
}

@media (min-width: 1240px) {
    .box { margin: 24px auto; padding: 24px; }
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
}

h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--green);
}

label {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: 6px;
}

select, button {
    font: inherit;
    font-size: .95rem;
}

select {
    width: 100%;
    max-width: 320px;
    height: 48px;
    padding: 0 12px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
}

select:focus, .student-input:focus {
    outline: none;
    border-color: var(--green-2);
    box-shadow: 0 0 0 3px rgba(17,89,74,.18);
}

button {
    padding: 0 16px;
    height: 40px;
    color: #fff;
    background: var(--green-2);
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .05s;
}

button:hover { background: var(--green); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.btn-back {
    color: var(--green);
    background: #fff;
    border: 2px solid var(--gold);
}
.btn-back:hover { background: #faf5e6; }

.btn-edit { color: var(--ink); background: var(--gold); }
.btn-edit:hover { background: #b78f38; }

.btn-danger { background: #b3261e; }
.btn-danger:hover { background: #8f1d17; }

/* ---------- Table ---------- */
.table-wrap {
    margin-top: 18px;
    overflow-x: auto;
    max-height: 75vh;
    overflow-y: auto;
    border: 1px solid #e2dcc9;
    border-radius: 10px;
}

.table-wrap:empty { display: none; }

table {
    width: 100%;
    border-collapse: collapse;
    font-size: .95rem;
    table-layout: fixed;
}

th {
    position: sticky;
    top: 0;
    padding: 12px 10px;
    color: var(--gold-soft);
    background: var(--green);
    font-weight: 600;
    text-align: center;
}

td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #ebe6d5;
}

tbody tr:nth-child(even) { background: #faf8f2; }

td:nth-child(1), th:nth-child(1) { width: 64px; }
td:nth-child(2) { text-align: left; }
td:nth-child(3), th:nth-child(3) { width: 220px; }

.actions { display: flex; gap: 8px; justify-content: center; }
.actions button { height: 30px; padding: 0 14px; font-size: .85rem; }

.student-input {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font: inherit;
    font-size: .95rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
}

/* ---------- Messages ---------- */
.success { color: #1b7a4b; font-weight: 700; margin-top: 12px; }
.error { color: #b3261e; font-weight: 700; margin-top: 12px; }

/* ---------- Phones: each student becomes a small card ---------- */
@media (max-width: 1000px) {
    .box { padding: 16px; margin: 16px 12px; }
    select { max-width: none; }
    .btn-back { width: 100%; }

    thead { display: none; }
    table, tbody { display: block; }

    tr {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 8px 10px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #ebe6d5;
    }

    td { padding: 0; border: none; width: auto !important; }
    td:nth-child(1) { font-weight: 700; color: var(--green); }
    td:nth-child(3) { grid-column: 1 / -1; }
    td[colspan] { grid-column: 1 / -1; text-align: center; color: var(--muted); }
    .actions button { flex: 1; }
}
</style>
</head>
<body>

<header class="top-bar">
    <div class="top-inner">
        <!-- 👇 PUT YOUR LOGO HERE: change the src to your file path or link -->
        <img
            class="logo"
            src="my-logo.png"
            alt="School logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='grid';"
        >
        <div class="logo-fallback" id="logoFallback">ص</div>

        <div>
            <div class="school-ar" dir="rtl">مدرسة صوت الحق</div>
            <h1>Admin Dashboard</h1>
        </div>
    </div>
</header>

<div class="box">
<div class="topbar">
<h2>Manage Students - Full Page</h2>
<button class="btn-back" onclick="window.location.href='admin.html'">← Back to Admin Dashboard</button>
</div>

<label for="viewClass">Select Class to View/Edit Students:</label>
<select id="viewClass" onchange="loadStudentsList()">
<option value="">Select Class</option>
</select>

<div class="table-wrap">
<table id="studentsTable" style="display:none">
<thead>
<tr>
<th>S/N</th>
<th>STUDENT NAME</th>
<th>ACTIONS</th>
</tr>
</thead>
<tbody id="studentsBody">
</tbody>
</table>
</div>

<div id="manageMsg"></div>
</div>

<script>
const SUPABASE_URL = 'https://epgegesdptpaegycughz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2VnZXNkcHRwYWVneWN1Z2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjk4NzcsImV4cCI6MjA5NzMwNTg3N30.9eK3TvMP5Ve_ZMQlGV12aSpT84CMxDUJTk_fnHCSBfQ'
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

window.onload = loadClasses;

async function loadClasses() {
    const {data} = await supabaseClient.from('classes').select('*').order('name');
    const sel = document.getElementById('viewClass');
    sel.innerHTML = '<option value="">Select Class</option>';
    data?.forEach(c => sel.innerHTML += `<option value="${c.name}">${c.name}</option>`);
}

async function loadStudentsList(){
    const cls = document.getElementById('viewClass').value;
    const table = document.getElementById('studentsTable');
    const tbody = document.getElementById('studentsBody');
    
    if(!cls){
        table.style.display = 'none';
        return;
    }
    
    const {data, error} = await supabaseClient.from('students').select('*').eq('class', cls).order('name');
    
    if(error || !data || data.length === 0){
        tbody.innerHTML = '<tr><td colspan="3">No students found in this class</td></tr>';
        table.style.display = 'table';
        return;
    }
    
    table.style.display = 'table';
    tbody.innerHTML = '';
    data.forEach((s, i) => {
        tbody.innerHTML += `
        <tr data-id="${s.id}">
            <td>${i+1}</td>
            <td><input type="text" value="${s.name}" id="name_${s.id}" class="student-input"></td>
            <td class="actions">
                <button class="btn-edit" onclick="updateStudent('${s.id}')">Update</button>
                <button class="btn-danger" onclick="deleteStudent('${s.id}')">Delete</button>
            </td>
        </tr>`;
    });
}

async function updateStudent(id){
    const newName = document.getElementById('name_'+id).value.trim();
    if(!newName){alert('Enter student name'); return}
    
    const {error} = await supabaseClient.from('students').update({name: newName}).eq('id', id);
    
    if(error){
        showMsg('Error: '+error.message, 'error');
    } else {
        showMsg('✅ Student name updated', 'success');
    }
}

async function deleteStudent(id){
    if(!confirm('Delete this student? This cannot be undone.')) return;
    
    const {error} = await supabaseClient.from('students').delete().eq('id', id);
    
    if(error){
        showMsg('Error: '+error.message, 'error');
    } else {
        showMsg('✅ Student deleted', 'success');
        loadStudentsList();
    }
}

function showMsg(text, type) {
    document.getElementById('manageMsg').innerHTML = `<p class="${type}">${text}</p>`;
    setTimeout(() => document.getElementById('manageMsg').innerHTML = '', 3000);
}
</script>
</body>
    </html>
